animations {
    fade_duration = 500
}

# GENERAL
general {
    no_fade_in = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = mononoki Nerd Font
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = mononoki Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

label {
    monitor =
    size = 250, 60
    position = 0, -100
    text = cmd[update:1000] echo "[$(uname -n)]"
    color = rgba(242, 243, 244, 0.75)
    font_size = 24
    font_family = mononoki Nerd Font
    halign = center
    valign = center
}
