# GENERAL
general {
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    screencopy_mode = 1
}

background {
    path = screenshot
    color = rgb(0, 0 ,0)
    blur_passes = 4
    blur_size = 2
}

input-field {
    monitor =

    size = 10%, 3%
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)

    font_color = rgb(242, 243, 244)
    check_color = rgb(163, 190, 140)
    fail_color = rgb(191, 97, 106)
    fade_on_empty = true
    placeholder_text = 
    swap_font_color = true

    position = 0, 0
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = mononoki Nerd Font
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-H:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = mononoki Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

label {
    monitor =
    size = 250, 60
    position = 0, -100
    text = <i><span>[currently locked]</span></i>
    color = rgba(242, 243, 244, 0.75)
    font_size = 24
    font_family = mononoki Nerd Font
    halign = center
    valign = center
}

label {
    monitor =
    halign = left
    valign = bottom
    size = 250, 60
    position = 50, 50
    font_size = 24
    font_family = mononoki Nerd Font
    color = rgba(242, 243, 244, 0.75)
    text = cmd[] echo "$(lswt | awk 'NR>1 {print $2}')"
}

label {
    montior =
    halign = center
    valign = bottom
    size = 250, 60
    position = 0, 50
    font_size = 24
    font_family = mononoki Nerd Font
    text_align = center
    color = rgba(242, 243, 244, 0.75)
    text = cmd[update:1000] echo "$(mpc -f '[now listening to: %artist% - %title%[ (on %album%)]]' current) $(mpc status '[\n%currenttime% / %totaltime% (%percenttime%)]')"
}

label {
    monitor =
    halign = right
    valign = bottom
    size = 250, 60
    position = -50, 50
    font_size = 24
    font_family = mononoki Nerd Font
    color = rgba(242, 243, 244, 0.75)
    text = cmd[] echo "logged in as: $(whoami)"
}
